name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo, necessário para a análise do SonarCloud

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run type-check
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - run: npm run test:unit -- --coverage
        working-directory: frontend

      - run: npm run cypress:run:component
        working-directory: frontend

      - run: npm run cypress:run:e2e
        working-directory: frontend

      - name: Setup JDK 17 (necessário para o SonarScanner)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token próprio do projeto do frontend no SonarCloud (escopo restrito a este projeto,
          # diferente do SONAR_TOKEN usado pelo backend-ci.yml) — ver documentation/QUALITY.md.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
        with:
          projectBaseDir: frontend

      - name: Publicar vídeos/screenshots do Cypress (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            frontend/cypress/videos
            frontend/cypress/screenshots
