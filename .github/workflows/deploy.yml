name: Deploy

# Publicação em produção (ver deploy/README.md). Só manual (Actions -> Deploy -> Run workflow) e só a partir da
# main: a role da AWS, assumida via OIDC sem chaves de acesso, confia apenas na branch main deste repositório.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # token OIDC para assumir a role da AWS

# Um deploy por vez; um segundo pedido espera o primeiro terminar em vez de cancelá-lo no meio.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  STACK_NAME: eusindico
  DOMINIO: eusindicogestao.com.br
  # Tag única por execução: os repositórios ECR têm tags imutáveis.
  TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  testes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Testes do backend
        working-directory: backend
        run: |
          # Chave descartável, só para os testes (o WebApplicationFactory sobe a autenticação JWT inteira).
          Jwt__SecretKey="$(openssl rand -base64 48)"
          echo "::add-mask::$Jwt__SecretKey"
          export Jwt__SecretKey
          dotnet test --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Testes unitários do frontend
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: "0" # o binário do Cypress não é usado aqui
        run: |
          npm ci
          npm run test:unit

  imagens:
    needs: testes
    # Runner ARM: as imagens precisam ser arm64, como a instância (t4g).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # O endereço do registro vem da própria action (sem AWS CLI: o runner ARM tem menos ferramentas que o
      # x64). Os nomes dos repositórios seguem a stack: <stack>-api e <stack>-web (cloudformation.yaml).
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Repositórios ECR
        run: |
          echo "API_REPO=${{ steps.ecr.outputs.registry }}/$STACK_NAME-api" >> "$GITHUB_ENV"
          echo "WEB_REPO=${{ steps.ecr.outputs.registry }}/$STACK_NAME-web" >> "$GITHUB_ENV"

      - name: Build e push da API
        run: |
          docker build -t "$API_REPO:$TAG" backend
          docker push "$API_REPO:$TAG"

      - name: Build e push do frontend
        run: |
          docker build --build-arg VITE_API_BASE_URL="https://api.$DOMINIO" -t "$WEB_REPO:$TAG" frontend
          docker push "$WEB_REPO:$TAG"

  deploy:
    needs: imagens
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy na instância (Session Manager)
        run: |
          saida() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          INSTANCIA=$(saida InstanceId)
          BUCKET=$(saida DataBucketName)
          API_IMAGE="$(saida ApiRepositoryUri):$TAG"
          WEB_IMAGE="$(saida WebRepositoryUri):$TAG"

          ESTADO=$(aws ec2 describe-instances --instance-ids "$INSTANCIA" --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || echo "desconhecido")
          if [ "$ESTADO" != "running" ]; then
            echo "::error::A instância está '$ESTADO'. Ligue-a antes (bash deploy/scripts/ligar.sh) e rode o deploy de novo."
            exit 1
          fi

          # A instância baixa os arquivos de deploy exatamente deste commit (repositório público) e roda o deploy.
          BASE="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/deploy"
          PARAMETROS=$(jq -n --arg base "$BASE" --arg api "$API_IMAGE" --arg web "$WEB_IMAGE" --arg bucket "$BUCKET" --arg dominio "$DOMINIO" '{commands: [
            "set -euo pipefail",
            "cd /opt/eusindico",
            "for f in docker-compose.yml Caddyfile scripts/servidor/deploy.sh scripts/servidor/backup.sh scripts/servidor/definir-senha-smtp.sh; do curl -fsSL \"\($base)/$f\" -o \"$(basename \"$f\")\"; done",
            "bash deploy.sh \"\($api)\" \"\($web)\" \"\($bucket)\" \"\($dominio)\""
          ]}')

          COMANDO=$(aws ssm send-command --instance-ids "$INSTANCIA" --document-name AWS-RunShellScript \
            --comment "deploy $GITHUB_SHA" --timeout-seconds 900 --parameters "$PARAMETROS" \
            --query Command.CommandId --output text)

          # Pull das imagens + migrations + healthcheck podem passar dos ~100 s do waiter padrão.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMANDO" --instance-id "$INSTANCIA" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$COMANDO" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy terminou com status $STATUS."
            exit 1
          fi

      - name: Conferir o site
        run: |
          for _ in $(seq 1 24); do
            if [ "$(curl -fsS --max-time 5 "https://api.$DOMINIO/health" 2>/dev/null)" = "Healthy" ] \
              && curl -fsS --max-time 5 -o /dev/null "https://$DOMINIO/"; then
              echo "No ar: https://$DOMINIO"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMINIO não respondeu (DNS já aponta para o IP da instância? Certificado emitido?)."
          exit 1
